<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DJ · Заказ треков</title>
<style>
:root{
  --accent:#7c8fff;
  --bg1:#0b0d14;
  --bg2:#141826;
  --blur:0px;
  --radius:18px;
  --panel:0.5;
  --txt:#eef1f6;
  --muted:rgba(238,241,246,.6);
  --line:rgba(255,255,255,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
  color:var(--txt);
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
  overflow-x:hidden;
  position:relative;
}

/* ---------- фон ---------- */
#bgimg{
  position:fixed;inset:-60px;z-index:-3;
  background-size:cover;background-position:center;
  filter:blur(var(--blur));
  opacity:.85;
  transition:filter .25s linear, background-image .6s ease;
  pointer-events:none;
  animation:slowZoom 30s ease-in-out infinite alternate;
}
@keyframes slowZoom{
  from{transform:scale(1) translate(0,0)}
  to{transform:scale(1.06) translate(-1%,-1%)}
}

#orbs{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.orb{
  position:absolute;border-radius:50%;
  filter:blur(80px);opacity:.22;
}
.orb.o1{
  width:400px;height:400px;
  background:radial-gradient(circle,var(--accent),transparent 65%);
  top:-140px;left:-140px;
  animation:floatOrb1 22s ease-in-out infinite alternate;
}
.orb.o2{
  width:480px;height:480px;
  background:radial-gradient(circle,#5c4a99,transparent 65%);
  bottom:-180px;right:-180px;
  animation:floatOrb2 26s ease-in-out infinite alternate;
}
.orb.o3{
  width:340px;height:340px;
  background:radial-gradient(circle,#8a5a7a,transparent 65%);
  top:45%;left:52%;
  animation:floatOrb3 30s ease-in-out infinite alternate;
}
@keyframes floatOrb1{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(120px,180px) scale(1.15)}
}
@keyframes floatOrb2{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(-140px,-160px) scale(1.1)}
}
@keyframes floatOrb3{
  0%{transform:translate(-50%,-50%) scale(.9)}
  100%{transform:translate(-40%,-60%) scale(1.2)}
}

.wrap{max-width:820px;margin:0 auto;padding:22px 16px 120px;position:relative;z-index:1}

/* ---------- DJ кнопка ---------- */
#djFab{
  position:fixed;right:18px;bottom:18px;z-index:900;
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 18px;border-radius:100px;
  background:rgba(255,255,255,.07);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--txt);font-weight:700;font-size:13px;letter-spacing:.1em;
  border:1px solid rgba(255,255,255,.12);
  cursor:pointer;overflow:hidden;
  box-shadow:0 8px 24px -8px rgba(0,0,0,.6);
  transition:transform .18s cubic-bezier(.2,1.3,.4,1), background .25s, border-color .25s;
}
#djFab:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.11);
  border-color:rgba(255,255,255,.2);
}
#djFab:active{transform:scale(.96)}
#djFab svg{width:16px;height:16px;transition:transform .7s cubic-bezier(.4,1.4,.4,1)}
#djFab:hover svg{transform:rotate(120deg)}

/* ---------- шапка ---------- */
.hero{text-align:center;padding:18px 8px 22px}
.dj-badge{
  display:inline-block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  padding:6px 14px;border-radius:100px;
  border:1px solid rgba(255,255,255,.15);
  color:var(--muted);
  background:rgba(255,255,255,.04);
  margin-bottom:14px;
  animation:fadeUp .7s .05s both;
}
.hero h1{
  font-size:clamp(26px,7vw,44px);line-height:1.05;margin:0 0 8px;
  font-weight:800;letter-spacing:-.02em;
  animation:fadeUp .8s .12s both;
}
.hero p{margin:0;color:var(--muted);font-size:15px;animation:fadeUp .8s .2s both}

/* ---------- карточки ---------- */
.card{
  background:rgba(15,18,26,var(--panel));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:14px;
  animation:fadeUp .6s both;
  position:relative;
  transition:transform .25s cubic-bezier(.2,1.2,.4,1), border-color .3s, background .3s;
}
.card:hover{
  transform:translateY(-2px);
  border-color:rgba(255,255,255,.14);
  background:rgba(18,21,30,calc(var(--panel) + .03));
}

#guestList .card, #djBody .card{ animation:fadeUp .55s both; }
#guestList .card:nth-child(1), #djBody .card:nth-child(1){animation-delay:.02s}
#guestList .card:nth-child(2), #djBody .card:nth-child(2){animation-delay:.06s}
#guestList .card:nth-child(3), #djBody .card:nth-child(3){animation-delay:.1s}
#guestList .card:nth-child(4), #djBody .card:nth-child(4){animation-delay:.14s}
#guestList .card:nth-child(5), #djBody .card:nth-child(5){animation-delay:.18s}
#guestList .card:nth-child(n+6), #djBody .card:nth-child(n+6){animation-delay:.22s}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* ---------- формы ---------- */
label.fl{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 2px;letter-spacing:.04em}
input[type=text],input[type=url],input[type=password],input[type=number],textarea,select{
  width:100%;padding:13px 14px;border-radius:12px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);
  color:var(--txt);font-size:15px;font-family:inherit;
  outline:none;
  transition:border-color .2s, background .2s;
}
input:focus,textarea:focus,select:focus{
  border-color:rgba(255,255,255,.28);
  background:rgba(255,255,255,.06);
}
input[type=color]{
  width:100%;height:44px;padding:3px;border-radius:12px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);cursor:pointer;
}
input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
input[type=file]{width:100%;font-size:13px;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.field{margin-bottom:12px}

/* ---------- кнопки ---------- */
button{font-family:inherit;cursor:pointer;border:none;outline:none;position:relative;overflow:hidden}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 20px;border-radius:12px;font-size:15px;font-weight:600;
  background:rgba(255,255,255,.07);color:var(--txt);
  border:1px solid rgba(255,255,255,.1);
  transition:transform .12s cubic-bezier(.2,1.3,.4,1), background .2s, border-color .2s;
}
.btn:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.16);transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn.primary{
  background:var(--accent);color:#0b0d14;border-color:transparent;
}
.btn.primary:hover{background:#8f9fff}
.btn.danger{background:rgba(255,90,118,.13);border-color:rgba(255,90,118,.25);color:#ff8a9a}
.btn.danger:hover{background:rgba(255,90,118,.2)}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.loading{pointer-events:none;opacity:.85}
.btn.loading::after{
  content:"";position:absolute;width:16px;height:16px;border-radius:50%;
  border:2px solid currentColor;border-top-color:transparent;
  animation:spin .7s linear infinite;right:14px;top:50%;margin-top:-8px;
}
@keyframes spin{to{transform:rotate(360deg)}}

.ripple{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.35),transparent 70%);
  transform:scale(0);animation:rippleAnim .6s ease-out forwards;
  pointer-events:none;
}
@keyframes rippleAnim{
  to{transform:scale(4);opacity:0}
}

/* ---------- табы ---------- */
.tabs{display:flex;gap:8px;margin:18px 0 12px;flex-wrap:wrap;animation:fadeUp .6s .15s both}
.tab{
  padding:10px 16px;border-radius:100px;font-size:14px;font-weight:600;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  color:var(--muted);
  transition:all .22s cubic-bezier(.2,1.2,.4,1);
}
.tab:hover{color:var(--txt);background:rgba(255,255,255,.08);transform:translateY(-1px)}
.tab.active{
  background:rgba(255,255,255,.11);
  color:var(--txt);
  border-color:rgba(255,255,255,.2);
  animation:tabPop .3s cubic-bezier(.2,1.6,.4,1);
}
@keyframes tabPop{
  0%{transform:scale(.94)}
  60%{transform:scale(1.04)}
  100%{transform:scale(1)}
}

/* ---------- треки ---------- */
.track{display:flex;flex-direction:column;gap:12px}
.track-head{display:flex;gap:12px;align-items:flex-start}
.track-num{
  flex:0 0 34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:rgba(255,255,255,.06);font-size:13px;font-weight:700;color:var(--muted);
  transition:transform .25s, background .25s, color .25s;
}
.track:hover .track-num{
  transform:rotate(-4deg) scale(1.06);
  background:rgba(255,255,255,.12);
  color:var(--txt);
}
.track-info{flex:1;min-width:0}
.track-title{font-size:16px;font-weight:700;line-height:1.25;word-break:break-word}
.track-artist{font-size:13px;color:var(--muted);margin-top:2px;word-break:break-word}
.track-meta{font-size:11px;color:rgba(238,241,246,.4);margin-top:4px}
.track audio{width:100%;height:36px;margin-top:8px}
.track-link{
  display:inline-block;margin-top:6px;font-size:12px;color:var(--accent);
  text-decoration:none;border-bottom:1px dashed currentColor;word-break:break-all;
  transition:opacity .2s;
}
.track-link:hover{opacity:.75}
.track-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.reactions{display:flex;gap:8px;margin-left:auto}
.react{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:100px;font-size:14px;font-weight:600;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  color:var(--muted);
  transition:all .22s cubic-bezier(.2,1.3,.4,1);
}
.react:hover{color:var(--txt);background:rgba(255,255,255,.09)}
.react:active{transform:scale(.93)}
.react.active{
  color:var(--txt);
  border-color:rgba(255,255,255,.25);
  background:rgba(255,255,255,.12);
  animation:reactPop .38s cubic-bezier(.2,1.6,.4,1);
}
.react.active[data-act=dislike]{
  border-color:rgba(255,138,154,.4);
  color:#ff8a9a;
  background:rgba(255,138,154,.1);
}
@keyframes reactPop{
  0%{transform:scale(1)}
  45%{transform:scale(1.18)}
  100%{transform:scale(1)}
}
.react span{font-variant-numeric:tabular-nums;min-width:8px;text-align:center}
.dj-actions{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- бейдж источника ---------- */
.src-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;
  vertical-align:middle;margin-left:6px;
  animation:badgeIn .45s .15s both;
}
@keyframes badgeIn{
  from{opacity:0;transform:translateX(-6px)}
  to{opacity:1;transform:translateX(0)}
}
.src-badge.spotify{background:rgba(29,185,84,.22);color:#7ee2a0}
.src-badge.yandex {background:rgba(255,204,0,.2);color:#ffd95c}
.src-badge.youtube{background:rgba(255,0,0,.2);color:#ff8080}
.src-badge.file   {background:rgba(255,255,255,.1);color:var(--muted)}
.src-badge.link   {background:rgba(255,255,255,.1);color:var(--muted)}
.src-badge svg{width:12px;height:12px;display:block}

/* ---------- встраивание ---------- */
.embed-wrap{
  margin-top:10px;border-radius:12px;overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.25);
  animation:fadeUp .5s .15s both;
}
.embed-wrap iframe{display:block;width:100%;border:0}
.embed-spotify iframe{height:152px}
.embed-yandex iframe{height:180px}
.embed-youtube iframe{height:200px}

/* ---------- пусто ---------- */
.empty{
  text-align:center;padding:40px 16px;color:var(--muted);font-size:14px;
  animation:fadeUp .6s both;
}
.empty::before{
  content:"🎧";display:block;font-size:38px;margin-bottom:12px;
  animation:floatY 3.5s ease-in-out infinite;
}
@keyframes floatY{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}

.footer{
  text-align:center;font-size:12px;color:rgba(238,241,246,.35);margin-top:34px;letter-spacing:.06em;
  animation:fadeUp .8s .3s both;
}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:96px;
  transform:translateX(-50%) translateY(140%) scale(.94);
  background:rgba(20,23,32,.96);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.12);
  padding:13px 22px;border-radius:100px;font-size:14px;font-weight:600;
  z-index:999;
  transition:transform .4s cubic-bezier(.2,1.4,.4,1), opacity .3s;
  white-space:nowrap;max-width:90vw;
  overflow:hidden;text-overflow:ellipsis;
  opacity:0;
  box-shadow:0 16px 40px -12px rgba(0,0,0,.7);
}
#toast.show{
  transform:translateX(-50%) translateY(0) scale(1);
  opacity:1;
}

/* ---------- прочее ---------- */
.hint{font-size:12px;color:rgba(238,241,246,.4);margin-top:6px;line-height:1.5}
.section-title{
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(238,241,246,.4);
  margin:22px 0 10px;
  animation:fadeUp .5s both;
}
.qr-box{
  display:grid;place-items:center;padding:16px;background:#fff;border-radius:16px;
  margin:12px auto;width:fit-content;
  animation:qrPop .55s cubic-bezier(.2,1.4,.4,1) both;
  box-shadow:0 16px 40px -14px rgba(0,0,0,.6);
}
.qr-box img{display:block;width:220px;height:220px}
@keyframes qrPop{
  0%{transform:scale(.6) rotate(-8deg);opacity:0}
  70%{transform:scale(1.04) rotate(2deg)}
  100%{transform:scale(1) rotate(0);opacity:1}
}
.copy-url{
  font-size:12px;word-break:break-all;background:rgba(255,255,255,.05);
  padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);
  font-family:ui-monospace,monospace;color:var(--muted);
}

/* ---------- частицы и конфетти ---------- */
.confetti{
  position:fixed;width:8px;height:12px;top:0;z-index:9999;
  pointer-events:none;opacity:.9;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(-20px) rotate(0) scale(1);opacity:1}
  100%{transform:translateY(100vh) rotate(600deg) scale(.7);opacity:0}
}

.particle{
  position:fixed;width:8px;height:8px;border-radius:50%;
  pointer-events:none;z-index:9998;
  animation:particleBurst .75s cubic-bezier(.2,.8,.3,1) forwards;
}
@keyframes particleBurst{
  0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--px),var(--py)) scale(0);opacity:0}
}

/* ---------- эквалайзер ---------- */
.eq{
  display:inline-flex;align-items:flex-end;gap:2px;height:12px;
  margin-left:8px;vertical-align:middle;opacity:.7;
}
.eq i{
  display:block;width:3px;border-radius:2px;background:rgba(238,241,246,.6);
  animation:eqBar .9s ease-in-out infinite;
}
.eq i:nth-child(1){animation-delay:0s;height:40%}
.eq i:nth-child(2){animation-delay:.15s;height:80%}
.eq i:nth-child(3){animation-delay:.3s;height:60%}
.eq i:nth-child(4){animation-delay:.45s;height:90%}
@keyframes eqBar{
  0%,100%{transform:scaleY(.4)}
  50%{transform:scaleY(1)}
}

#root{animation:viewIn .45s ease both}
@keyframes viewIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>
<div id="bgimg"></div>
<div id="orbs">
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
</div>
<div id="root"></div>

<button id="djFab" title="Вход в DJ-панель" aria-label="DJ panel">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6 1.65 1.65 0 0 0 10 3.09V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.2.5.7.9 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
  </svg>
  DJ
</button>

<div id="toast"></div>

<script>
/* =========================================================
   ХРАНИЛИЩЕ
   ========================================================= */
const K_SET = 'dj_settings_v1';
const K_TRK = 'dj_tracks_v1';
const K_PWD = 'dj_pass_v1';
const K_VID = 'dj_viewer_id';
const K_SES = 'dj_session';

const DEFAULT_SET = {
  djName: 'DJ NAME',
  title: 'ЗАКАЖИ ТРЕК',
  subtitle: 'Отправь свой трек — я поставлю его в сет',
  footer: 'Спасибо, что вы с нами ✦',
  accent: '#7c8fff',
  bg1: '#0b0d14',
  bg2: '#141826',
  bgImage: '',
  blur: 0,
  panel: 0.5,
  radius: 18
};

const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ toast('Хранилище переполнено'); } };

let settings = Object.assign({}, DEFAULT_SET, load(K_SET, {}));
let tracks = load(K_TRK, []);

function getPass(){ return localStorage.getItem(K_PWD) || 'admin'; }
function setPass(p){ localStorage.setItem(K_PWD, p); }

let viewerId = localStorage.getItem(K_VID);
if(!viewerId){
  viewerId = 'v_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  localStorage.setItem(K_VID, viewerId);
}

/* =========================================================
   УТИЛИТЫ
   ========================================================= */
const $ = s => document.querySelector(s);
const uid = () => 't_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

const readFileAsDataURL = f => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.onerror = rej;
  r.readAsDataURL(f);
});

function timeAgo(ts){
  const d = Math.floor((Date.now() - ts)/1000);
  if(d < 60) return 'только что';
  if(d < 3600) return Math.floor(d/60) + ' мин назад';
  if(d < 86400) return Math.floor(d/3600) + ' ч назад';
  return Math.floor(d/86400) + ' дн назад';
}

function applySettings(){
  const r = document.documentElement.style;
  r.setProperty('--accent', settings.accent);
  r.setProperty('--bg1', settings.bg1);
  r.setProperty('--bg2', settings.bg2);
  r.setProperty('--blur', settings.blur + 'px');
  r.setProperty('--radius', settings.radius + 'px');
  r.setProperty('--panel', settings.panel);
  const bg = $('#bgimg');
  if(bg) bg.style.backgroundImage = settings.bgImage ? `url("${settings.bgImage}")` : 'none';
  document.body.style.background = `linear-gradient(160deg,${settings.bg1},${settings.bg2}) fixed`;
}

/* =========================================================
   ЭФФЕКТЫ
   ========================================================= */
function fireConfetti(originEl){
  const colors = ['#7c8fff','#8f9fff','#5c4a99','#a0a8c0','#eef1f6'];
  let cx = window.innerWidth/2, cy = window.innerHeight/2;
  if(originEl){
    const r = originEl.getBoundingClientRect();
    cx = r.left + r.width/2;
    cy = r.top + r.height/2;
  }
  for(let i = 0; i < 32; i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = cx + 'px';
    el.style.top = cy + 'px';
    el.style.background = colors[(Math.random()*colors.length)|0];
    el.style.animationDuration = (1.6 + Math.random()*1.2) + 's';
    el.style.animationDelay = (Math.random()*0.2) + 's';
    const spread = (Math.random() - .5) * 240;
    el.style.marginLeft = spread + 'px';
    if(Math.random() > .5) el.style.borderRadius = '50%';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }
}

function fireParticles(el, positive){
  if(!el) return;
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const color = positive ? '#8f9fff' : '#ff8a9a';
  for(let i = 0; i < 9; i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.background = color;
    const ang = (i / 9) * Math.PI * 2;
    const dist = 34 + Math.random()*32;
    p.style.setProperty('--px', Math.cos(ang)*dist + 'px');
    p.style.setProperty('--py', Math.sin(ang)*dist + 'px');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 850);
  }
}

function attachRipple(){
  document.querySelectorAll('.btn, .tab, .react, #djFab').forEach(el => {
    if(el.dataset.ripple === '1') return;
    el.dataset.ripple = '1';
    el.addEventListener('click', e => {
      const r = el.getBoundingClientRect();
      const size = Math.max(r.width, r.height);
      const x = e.clientX - r.left - size/2;
      const y = e.clientY - r.top - size/2;
      const rip = document.createElement('span');
      rip.className = 'ripple';
      rip.style.width = rip.style.height = size + 'px';
      rip.style.left = x + 'px';
      rip.style.top = y + 'px';
      el.appendChild(rip);
      setTimeout(() => rip.remove(), 650);
    });
  });
}

/* =========================================================
   ИСТОЧНИКИ
   ========================================================= */
function detectSource(url){
  if(!url) return null;
  if(/open\.spotify\.com/i.test(url)) return 'spotify';
  if(/music\.yandex/i.test(url))     return 'yandex';
  if(/youtube\.com|youtu\.be/i.test(url)) return 'youtube';
  return 'link';
}
function spotifyEmbed(url){
  const m = url.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|album|playlist|episode|artist)\/([A-Za-z0-9]+)/i);
  if(!m) return null;
  return `https://open.spotify.com/embed/${m[1]}/${m[2]}?utm_source=generator&theme=0`;
}
function yandexEmbed(url){
  let trackId = null, albumId = null;
  let m = url.match(/\/album\/(\d+)\/track\/(\d+)/);
  if(m){ albumId = m[1]; trackId = m[2]; }
  else { m = url.match(/\/track\/(\d+)/); if(m) trackId = m[1]; }
  if(!trackId) return null;
  const hash = albumId ? `#track/${trackId}/${albumId}` : `#track/${trackId}`;
  return `https://music.yandex.ru/iframe/${hash}`;
}
function youtubeEmbed(url){
  let m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : null;
}

  if(src === 'yandex')  return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm-1.9 17.8h-1.9l2.1-6.6c.2-.6-.1-1.2-.7-1.4-.9-.3-1.5-1.1-1.5-2 0-1.2 1-2.2 2.2-2.2 1.6 0 2.7 1.3 2.7 2.8 0 .6-.1 1.1-.4 1.6l-2.5 7.8zm6.7 0h-1.9l1-3.1c-.5.3-1.1.5-1.7.5-1.5 0-2.8-1-2.8-2.4 0-.5.1-.9.4-1.3l1.9.9c-.1.2-.2.4-.2.6 0 .4.3.7.7.7.5 0 .9-.2 1.2-.6l1.4-4.3h1.9l-1.9 9z"/></svg>`;
  if(src === 'youtube') return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8zM9.6 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg>`;
  if(src === 'file')    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`;
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>`;
}
function srcLabel(src){
  return { spotify:'Spotify', yandex:'Яндекс.Музыка', youtube:'YouTube', file:'Аудиофайл', link:'Ссылка' }[src] || 'Ссылка';
}
function renderEmbed(src, url){
  if(src === 'spotify'){ const e = spotifyEmbed(url); if(e) return `<div class="embed-wrap embed-spotify"><iframe src="${e}" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe></div>`; }
  if(src === 'yandex'){ const e = yandexEmbed(url); if(e) return `<div class="embed-wrap embed-yandex"><iframe src="${e}" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe></div>`; }
  if(src === 'youtube'){ const e = youtubeEmbed(url); if(e) return `<div class="embed-wrap embed-youtube"><iframe src="${e}" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe></div>`; }
  return '';
}

   РОУТИНГ
   ========================================================= */
const state = { view:'guest', guestTab:'queue', djTab:'queue' };

function isDjUrl(){
  const p = new URLSearchParams(location.search);
  return p.has('dj') || location.hash === '#dj';
}
(function initRoute(){
  state.view = isDjUrl()
    ? (sessionStorage.getItem(K_SES) === 'ok' ? 'dj' : 'djlogin')
    : 'guest';
})();

/* =========================================================
   ТРЕКИ
   ========================================================= */
function saveTracks(){ save(K_TRK, tracks); }
function myReaction(t){
  if(t.likes.includes(viewerId)) return 'like';
  if(t.dislikes.includes(viewerId)) return 'dislike';
  return null;
}
function react(id, type, ev){
  const t = tracks.find(x => x.id === id);
  if(!t) return;
  const cur = myReaction(t);
  t.likes = t.likes.filter(v => v !== viewerId);
  t.dislikes = t.dislikes.filter(v => v !== viewerId);
  if(cur !== type){
    if(type === 'like'){ t.likes.push(viewerId); fireParticles(ev?.currentTarget, true); }
    else { t.dislikes.push(viewerId); fireParticles(ev?.currentTarget, false); }
  }
  saveTracks(); render();
}
function markPlayed(id){
  const t = tracks.find(x => x.id === id);
  if(!t) return;
  t.status = 'played';
  t.playedAt = Date.now();
  saveTracks(); render(); toast('▶ Трек отправлен в сыгранные');
}
function markQueued(id){
  const t = tracks.find(x => x.id === id);
  if(!t) return;
  t.status = 'queue'; delete t.playedAt;
  saveTracks(); render(); toast('↺ Трек вернулся в очередь');
}
function deleteTrack(id){
  tracks = tracks.filter(t => t.id !== id);
  saveTracks(); render(); toast('✕ Трек удалён');
}
function moveTrack(id, dir){
  const i = tracks.findIndex(t => t.id === id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= tracks.length) return;
  if(tracks[j].status !== 'queue' || tracks[i].status !== 'queue') return;
  [tracks[i], tracks[j]] = [tracks[j], tracks[i]];
  saveTracks(); render();
}

/* =========================================================
   SPOTIFY lookup
   ========================================================= */
async function lookupUrl(url){
  if(!url) return null;
  if(/open\.spotify\.com/.test(url)){
    try{
      const r = await fetch('https://open.spotify.com/oembed?url=' + encodeURIComponent(url));
      if(r.ok){ const j = await r.json(); return { title: j.title||'', artist: j.author_name||'', thumb: j.thumbnail_url||'' }; }
    }catch(e){}
  }
  return null;
}

/* =========================================================
   РЕНДЕР (сохраняет позицию скролла)
   ========================================================= */
function render(opts = {}){
  const keepScroll = opts.keepScroll !== false;
  const scrollY = keepScroll ? window.scrollY : 0;

  applySettings();
  const root = $('#root');
  if(state.view === 'guest') root.innerHTML = viewGuest();
  else if(state.view === 'djlogin') root.innerHTML = viewDjLogin();
  else root.innerHTML = viewDj();

  if(state.view === 'guest') bindGuest();
  if(state.view === 'djlogin') bindDjLogin();
  if(state.view === 'dj') bindDj();
  attachRipple();
  syncFab();

  if(keepScroll && scrollY > 0){
    window.scrollTo({ top: scrollY, behavior: 'instant' });
  }
}

function scrollToList(){
  const el = document.querySelector('.tabs');
  if(!el) return;
  const top = el.getBoundingClientRect().top + window.scrollY - 16;
  window.scrollTo({ top, behavior: 'smooth' });
}

function trackCardGuest(t, idx){
  const my = myReaction(t);
  const src = t.source || detectSource(t.url) || (t.file ? 'file' : 'link');
  const hasEmbed = t.url && ['spotify','yandex','youtube'].includes(src);
  return `
  <div class="card track">
    <div class="track-head">
      <div class="track-num">${idx}</div>
      <div class="track-info">
        <div class="track-title">
          ${esc(t.title)}
          <span class="src-badge ${src}">${srcIcon(src)}${srcLabel(src)}</span>
          ${t.status === 'queue' ? `<span class="eq" title="в очереди"><i></i><i></i><i></i><i></i></span>` : ''}
        </div>
        <div class="track-artist">${esc(t.artist || 'Неизвестный исполнитель')}</div>

        <button class="react ${my === 'dislike' ? 'active' : ''}" data-act="dislike" data-id="${t.id}">👎 <span>${t.dislikes.length}</span></button>
      </div>
    </div>
  </div>`;
}

function viewGuest(){
  const queue = tracks.filter(t => t.status === 'queue');
  const played = tracks.filter(t => t.status === 'played').sort((a,b) => (b.playedAt||0) - (a.playedAt||0));

  let listHtml = '';
  if(state.guestTab === 'queue'){
    listHtml = queue.length
      ? queue.map((t,i) => trackCardGuest(t, i+1)).join('')
      : `<div class="empty">Пока пусто — стань первым</div>`;
  } else {
    listHtml = played.length
      ? played.map((t,i) => trackCardGuest(t, i+1)).join('')
      : `<div class="empty">Ещё ничего не сыграно</div>`;
  }

  return `
  <div class="wrap">
    <div class="hero">
      <div class="dj-badge">${esc(settings.djName)}</div>
      <h1>${esc(settings.title)}</h1>
      <p>${esc(settings.subtitle)}</p>
    </div>

    <form id="orderForm" class="card">
      <div class="field">
        <label class="fl">Название трека *</label>
        <input type="text" id="fTitle" placeholder="Например: Blinding Lights" autocomplete="off" required>
      </div>
      <div class="field">
        <label class="fl">Исполнитель</label>
        <input type="text" id="fArtist" placeholder="The Weeknd" autocomplete="off">
      </div>
      <div class="field">
        <label class="fl">Ссылка (Spotify / Яндекс.Музыка / YouTube)</label>
        <input type="url" id="fUrl" placeholder="https://open.spotify.com/track/..." autocomplete="off">
              </div>
      <div class="field">
        <label class="fl"></label>
        <input type="file" id="fFile" accept="audio/*">
      </div>
      <button type="submit" class="btn primary full">Отправить заказ</button>
    </form>

    <div class="tabs">
      <button class="tab ${state.guestTab === 'queue' ? 'active' : ''}" data-gtab="queue">Очередь · ${queue.length}</button>
      <button class="tab ${state.guestTab === 'played' ? 'active' : ''}" data-gtab="played">Сыграно · ${played.length}</button>
    </div>

    <div id="guestList">${listHtml}</div>

    <div class="footer">${esc(settings.footer)}</div>
  </div>`;
}

function bindGuest(){
  const urlInp = $('#fUrl');
  let t;
  urlInp.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(async () => {
      const v = urlInp.value.trim();
      if(!v || v.length < 15) return;
      if(!/open\.spotify\.com/.test(v)) return;
      if($('#fTitle').value.trim()) return;
      const info = await lookupUrl(v);
      if(info && info.title){
        $('#fTitle').value = info.title;
        if(info.artist) $('#fArtist').value = info.artist;
        toast('🎵 Данные подтянуты из Spotify');
      }
    }, 700);
  });

  $('#orderForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    const titleEl = $('#fTitle'), artistEl = $('#fArtist'), urlEl = $('#fUrl'), fileEl = $('#fFile');
    let title = titleEl.value.trim();
    let artist = artistEl.value.trim();
    const url = urlEl.value.trim();
    const file = fileEl.files[0];

    let fileData = null;
    if(file){
      if(file.size > 2.5*1024*1024){ toast('Файл больше 2.5 МБ — загрузи поменьше'); return; }
      fileData = await readFileAsDataURL(file);
      if(!title) title = file.name.replace(/\.[^.]+$/, '');
    }
    if(url && !title){
      const info = await lookupUrl(url);
      if(info && info.title){ title = info.title; artist = artist || info.artist || ''; }
    }
    if(!title){ toast('Укажи название трека'); return; }

    btn.classList.add('loading');
    const source = detectSource(url) || (fileData ? 'file' : 'link');
    tracks.push({
      id: uid(), title, artist, url, file: fileData, source,
      status: 'queue', createdAt: Date.now(), likes: [], dislikes: []
    });
    saveTracks();

    titleEl.value=''; artistEl.value=''; urlEl.value=''; fileEl.value='';
    state.guestTab = 'queue';

    const rect = btn.getBoundingClientRect();
    render();
    fireConfetti({ getBoundingClientRect: () => rect });
    toast('🔥 Трек отправлен диджею');
  });

  document.querySelectorAll('[data-gtab]').forEach(b => {
    if(state.guestTab === b.dataset.gtab) return;
    b.addEventListener('click', () => {
      state.guestTab = b.dataset.gtab;
      render({ keepScroll: false });
      scrollToList();
    });
  });

  document.querySelectorAll('.react').forEach(b => {
    b.addEventListener('click', ev => react(b.dataset.id, b.dataset.act, ev));
  });
}

      <div class="card">
        <div class="section-title" style="margin-top:0">Тексты</div>
        <div class="field"><label class="fl">Имя диджея</label><input type="text" data-set="djName" value="${esc(s.djName)}"></div>
        <div class="field"><label class="fl">Заголовок</label><input type="text" data-set="title" value="${esc(s.title)}"></div>
        <div class="field"><label class="fl">Подзаголовок</label><input type="text" data-set="subtitle" value="${esc(s.subtitle)}"></div>
        <div class="field"><label class="fl">Текст внизу</label><input type="text" data-set="footer" value="${esc(s.footer)}"></div>
      </div>

      <div class="card">
        <div class="section-title" style="margin-top:0">Цвета</div>
        <div class="row">
          <div class="field"><label class="fl">Акцент</label><input type="color" data-set="accent" value="${s.accent}"></div>
          <div class="field"><label class="fl">Фон 1</label><input type="color" data-set="bg1" value="${s.bg1}"></div>
        </div>
        <div class="field"><label class="fl">Фон 2 (градиент)</label><input type="color" data-set="bg2" value="${s.bg2}"></div>
      </div>

      <div class="card">
        <div class="section-title" style="margin-top:0">Фон · изображение</div>
        <div class="field">
          <label class="fl">Ссылка на изображение</label>
          <input type="url" data-set="bgImage" value="${esc(s.bgImage)}" placeholder="https://...">
        </div>
        <div class="field">
          <label class="fl">…или загрузи файл (до 2 МБ)</label>
          <input type="file" id="bgFile" accept="image/*">
        </div>
        <button class="btn sm" id="clearBg">Убрать изображение</button>
      </div>

      <div class="card">
        <div class="section-title" style="margin-top:0">Эффекты</div>
        <div class="field">
          <label class="fl">Размытие фона — <span id="blurVal">${s.blur}</span>px</label>
          <input type="range" min="0" max="40" step="1" data-set="blur" value="${s.blur}">
        </div>
        <div class="field">
          <label class="fl">Прозрачность панелей — <span id="panelVal">${Math.round(s.panel*100)}</span>%</label>
          <input type="range" min="0" max="95" step="1" data-set="panel" value="${Math.round(s.panel*100)}">
        </div>
        <div class="field">
          <label class="fl">Скругление углов — <span id="radiusVal">${s.radius}</span>px</label>
          <input type="range" min="0" max="32" step="1" data-set="radius" value="${s.radius}">
        </div>
        <button class="btn sm" id="resetDesign">Сбросить дизайн</button>
      </div>

      <div class="card">
        <div class="section-title" style="margin-top:0">Безопасность</div>
        <div class="field"><label class="fl">Новый пароль DJ-зоны</label><input type="password" id="newPwd" placeholder="Оставь пустым, чтобы не менять"></div>
        <button class="btn sm" id="savePwd">Сохранить пароль</button>
      </div>

      <div class="card">
        <div class="section-title" style="margin-top:0">Данные</div>
        <button class="btn sm danger" id="clearPlayed">Очистить сыгранные</button>
        <button class="btn sm danger" id="clearAll">Удалить все треки</button>
      </div>
    `;
  }

  if(state.djTab === 'qr'){
    const guestUrl = location.origin + location.pathname;
    const qr = 'https://api.qrserver.com/v1/create-qr-code/?size=440x440&margin=0&data=' + encodeURIComponent(guestUrl);
    body = `
      <div class="card" style="text-align:center">
        <div class="section-title" style="margin-top:0">QR для гостей</div>
        <div class="qr-box"><img src="${qr}" alt="QR"></div>
        <div class="copy-url">${esc(guestUrl)}</div>
        <div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button class="btn sm" id="copyUrl">Скопировать ссылку</button>
          <button class="btn sm primary" id="showQr">Показать QR на весь экран</button>
        </div>
        <div class="hint">Гости сканируют QR и попадают в гостевую зону.<br>
        Для работы с разных устройств размести сайт на хостинге (GitHub Pages, Netlify, Vercel).</div>
      </div>`;
  }

  return `
  <div class="wrap">
    <div class="hero">
      <div class="dj-badge">DJ ZONE</div>
      <h1>Пульт</h1>
      <p>Очередь · Сыграно · Дизайн · QR</p>
    </div>

    <div class="tabs">
      <button class="tab ${state.djTab==='queue'?'active':''}" data-dtab="queue">Очередь · ${queue.length}</button>
      <button class="tab ${state.djTab==='played'?'active':''}" data-dtab="played">Сыграно · ${played.length}</button>
      <button class="tab ${state.djTab==='settings'?'active':''}" data-dtab="settings">Дизайн</button>
      <button class="tab ${state.djTab==='qr'?'active':''}" data-dtab="qr">QR</button>
      <button class="tab" id="logout" style="margin-left:auto">Выйти</button>
    </div>

    <div id="djBody">${body}</div>
  </div>`;
}

function bindDj(){
  document.querySelectorAll('[data-dtab]').forEach(b => {
    if(state.djTab === b.dataset.dtab) return;
    b.addEventListener('click', () => {
      state.djTab = b.dataset.dtab;
      render({ keepScroll: false });
      if(state.djTab === 'queue' || state.djTab === 'played') scrollToList();
      else window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  const lo = $('#logout');
  if(lo) lo.addEventListener('click', () => {
    sessionStorage.removeItem(K_SES);
    location.href = location.pathname;
  });

  document.querySelectorAll('[data-a]').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.dataset.id, a = b.dataset.a;
      if(a === 'played') markPlayed(id);
      else if(a === 'queued') markQueued(id);
      else if(a === 'del'){ if(confirm('Удалить трек?')) deleteTrack(id); }
      else if(a === 'up') moveTrack(id, -1);
      else if(a === 'down') moveTrack(id, 1);
    });
  });

  document.querySelectorAll('[data-set]').forEach(inp => {
    const key = inp.dataset.set;
    const handler = () => {
      let v = inp.value;
      if(key === 'blur'){ v = parseInt(v); const el = $('#blurVal'); if(el) el.textContent = v; }
      if(key === 'panel'){ v = parseInt(v)/100; const el = $('#panelVal'); if(el) el.textContent = Math.round(v*100); }
      if(key === 'radius'){ v = parseInt(v); const el = $('#radiusVal'); if(el) el.textContent = v; }
      settings[key] = v;
      save(K_SET, settings);
      applySettings();
    };
    inp.addEventListener('input', handler);
    inp.addEventListener('change', handler);
  });

  const bgFile = $('#bgFile');
  if(bgFile) bgFile.addEventListener('change', async () => {
    const f = bgFile.files[0];
    if(!f) return;
    if(f.size > 2*1024*1024){ toast('Картинка больше 2 МБ'); return; }
    settings.bgImage = await readFileAsDataURL(f);
    save(K_SET, settings);
    render();
    toast('🖼 Фон обновлён');
  });

  const clearBg = $('#clearBg');
  if(clearBg) clearBg.addEventListener('click', () => {
    settings.bgImage = '';
    save(K_SET, settings);
    render();
  });

  const resetDesign = $('#resetDesign');
  if(resetDesign) resetDesign.addEventListener('click', () => {
    settings = Object.assign({}, DEFAULT_SET, { djName: settings.djName, title: settings.title, subtitle: settings.subtitle, footer: settings.footer });
    save(K_SET, settings);
    render();
    toast('✨ Дизайн сброшен');
  });

  const savePwd = $('#savePwd');
  if(savePwd) savePwd.addEventListener('click', () => {
    const v = $('#newPwd').value.trim();
    if(v.length < 3){ toast('Минимум 3 символа'); return; }
    setPass(v);
    $('#newPwd').value = '';
    toast('🔒 Пароль обновлён');
  });

  const cp = $('#clearPlayed');
  if(cp) cp.addEventListener('click', () => {
    if(!confirm('Удалить все сыгранные треки?')) return;
    tracks = tracks.filter(t => t.status !== 'played');
    saveTracks(); render(); toast('Сыгранные очищены');
  });

  const ca = $('#clearAll');
  if(ca) ca.addEventListener('click', () => {
    if(!confirm('Удалить ВСЕ треки безвозвратно?')) return;
    tracks = [];
    saveTracks(); render(); toast('Все треки удалены');
  });

  const copyUrl = $('#copyUrl');
  if(copyUrl) copyUrl.addEventListener('click', async () => {
    const url = location.origin + location.pathname;
    try{ await navigator.clipboard.writeText(url); toast('📋 Ссылка скопирована'); }
    catch(e){ toast(url); }
  });

  const showQr = $('#showQr');
  if(showQr) showQr.addEventListener('click', () => {
    const url = location.origin + location.pathname;
    const qr = 'https://api.qrserver.com/v1/create-qr-code/?size=900x900&margin=10&data=' + encodeURIComponent(url);
    const w = window.open('', '_blank');
    if(w){
      w.document.write(`<html><head><title>QR</title><style>
        body{margin:0;background:#000;display:grid;place-items:center;height:100vh}
        img{width:min(90vmin,90vw);height:auto;background:#fff;padding:20px;border-radius:20px;
          animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
        @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
      </style></head><body><img src="${qr}"></body></html>`);
    }
  });
}

/* =========================================================
   DJ КНОПКА
   ========================================================= */
$('#djFab').addEventListener('click', () => {
  if(state.view === 'guest'){ location.search = '?dj=1'; }
  else if(state.view === 'dj'){
    state.view = 'guest';
    history.replaceState(null, '', location.pathname);
    render();
  }
});
function syncFab(){
  const fab = $('#djFab');
  if(!fab) return;
  fab.style.display = (state.view === 'dj' || state.view === 'djlogin') ? 'none' : 'inline-flex';
}

/* =========================================================
   SYNC
   ========================================================= */
window.addEventListener('storage', e => {
  if(e.key === K_TRK){ tracks = load(K_TRK, []); render(); }
  if(e.key === K_SET){ settings = Object.assign({}, DEFAULT_SET, load(K_SET, {})); render(); }
});

/* =========================================================
   СТАРТ
   ========================================================= */
applySettings();
render();

setInterval(() => { if(state.view === 'guest' || state.view === 'dj') render(); }, 60000);
</script>
</body>
</html>
